name: Docker Build, Push, and SBOM (Scheduled and On Push)

on:
  push:
    branches:
      - master  # Triggered when changes are pushed to the 'master' branch
    paths:
      - 'modules/docker/**'  # Triggered when any file under the 'modules/docker/' directory is modified
  schedule:
    - cron: '0 2 * * 0'  # This runs every day at 2 AM UTC

jobs:
  build_mysql5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Docker login step
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker image for MySQL5 (Multi-Architecture)
        uses: docker/build-push-action@v6
        with:
          context: modules/docker/mysql5
          file: modules/docker/mysql5/Docker/dockerfile  # Corrected file path
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mysql5:latest-x86_64
            ${{ secrets.DOCKER_USERNAME }}/mysql5:latest-arm64
          platforms: linux/amd64,linux/arm64  # Build for both x86_64 and arm64 architectures
          build-args: |
            DOCKER_REGISTRY_CACHE=${{ vars.DOCKER_REGISTRY_CACHE }}
            IMAGE_MYSQL5=${{ vars.IMAGE_MYSQL5 }}
          sbom: true
          provenance: mode=max

  build_mongodb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Docker login step
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker image for MongoDB (Multi-Architecture)
        uses: docker/build-push-action@v6
        with:
          context: modules/docker/mongodb
          file: modules/docker/mongodb/Dockerfile  # Ensure this path is correct for MongoDB Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mongodb:latest-x86_64
            ${{ secrets.DOCKER_USERNAME }}/mongodb:latest-arm64
          platforms: linux/amd64,linux/arm64  # Build for both x86_64 and arm64 architectures
          build-args: |
            DOCKER_REGISTRY_CACHE=${{ vars.DOCKER_REGISTRY_CACHE }}
            IMAGE_OPENSUSELEAP=${{ vars.IMAGE_OPENSUSELEAP }}
          sbom: true
          provenance: mode=max
