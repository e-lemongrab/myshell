name: Docker build, push, and SBOM

on:
  push:
    branches: [master]
    paths:
      - "modules/docker/**"
      - ".github/workflows/schedule.yml"
  schedule:
    - cron: "0 2 * * 0" # Every Sunday at 02:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql5
            context: modules/docker/mysql5
            dockerfile: modules/docker/mysql5/Docker/Dockerfile
            base_arg: IMAGE_MYSQL5=${{ vars.IMAGE_MYSQL5 || 'mysql:5.7.43' }}
          - image: mysql8
            context: modules/docker/mysql8
            dockerfile: modules/docker/mysql8/Docker/Dockerfile
            base_arg: IMAGE_MYSQL8=${{ vars.IMAGE_MYSQL8 || 'mysql:8.4.4' }}
          - image: mongodb
            context: modules/docker/mongodb
            dockerfile: modules/docker/mongodb/Docker/Dockerfile
            base_arg: IMAGE_OPENSUSELEAP=${{ vars.IMAGE_OPENSUSELEAP || 'opensuse/leap:15.6' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          build-args: |
            DOCKER_REGISTRY_CACHE=${{ vars.DOCKER_REGISTRY_CACHE || 'docker.io' }}
            ${{ matrix.base_arg }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max
