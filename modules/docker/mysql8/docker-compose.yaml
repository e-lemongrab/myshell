services:
  mysql8:
    container_name: mysql8
    build:
      context: '.'
      dockerfile: ./Docker/Dockerfile
      args:
        DOCKER_REGISTRY_CACHE: "docker.io"
        IMAGE_MYSQL8: "mysql:8.4.4"
    volumes:
      - db_data_2:/var/lib/mysql
      - ./Docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "4836:3306"
    restart: always
    environment:
      ENVIRONMENT: DEV
      MYSQL_ROOT_PASSWORD: 1nternet!
      MYSQL_DATABASE: sistemes-dos
      MYSQL_USER: sistemes
      MYSQL_PASSWORD: 1nternet!
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  db_data_2: {}
networks:
  default:
    name: sistemes
